[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "homotopy-path-learning"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.25.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]
julia = [
    "juliacall==0.9.31",
]
integration = [
    "pytest>=8.0",
    "juliacall==0.9.31",
]
env = [
    "gymnasium>=1.0,<2.0",
]
phase5 = [
    "pytest>=8.0",
    "gymnasium>=1.0,<2.0",
    "juliacall==0.9.31",
]
rl = [
    "torch==2.3.0+cu121",
    "PyYAML>=5.4,<7.0",
]
phase6 = [
    "pytest>=8.0",
    "gymnasium>=1.0,<2.0",
    "juliacall==0.9.31",
    "torch==2.3.0+cu121",
    "PyYAML>=5.4,<7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: requires the reference Julia runtime and Julia project",
    "slow: long-running smoke or regression test",
    "phase6: PPO training and experiment pipeline tests",
    "phase7: performance and numerical-equivalence tests",
]
